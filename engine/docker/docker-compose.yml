version: '3.8'

services:
  mt5-gateway:
    image: elitekaycy/mt5-gateway-api:0.3.21
    container_name: mt5-gateway
    restart: unless-stopped
    environment:
      # Credentials MT5 (un seul compte par instance de gateway)
      MT5_LOGIN: ${MT5_LOGIN}
      MT5_PASSWORD: ${MT5_PASSWORD}
      MT5_SERVER: ${MT5_SERVER}
      # API key pour l'authentification des requêtes
      API_KEY: ${MT5_GATEWAY_API_KEY}
      # Fuseau horaire du serveur (0 = UTC)
      MT5_SERVER_UTC_OFFSET_SECONDS: "0"
    volumes:
      - mt5-gateway-config:/config
    ports:
      - "5001:5001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS -H "Authorization: Bearer $$API_KEY" http://localhost:5001/health/ready',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  mt5-gateway-config:
