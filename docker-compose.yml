# PostgreSQL local pour le developpement et les tests d'integration (§12.2).
# En production: base managee Neon, une base separee par environnement.
services:
  db:
    image: postgres:16-alpine
    container_name: mt5-platform-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: mt5_platform
    ports:
      - "5432:5432"
    volumes:
      - mt5_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d mt5_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mt5_pgdata:
